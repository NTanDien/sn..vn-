<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hành Trình Tuổi 18 Rực Rỡ ✨</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- 1. Thư viện WebGL 3D (Three.js) & Động lực học (GSAP) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <!-- 2. Trình biên dịch ngôn ngữ PYTHON trên trình duyệt (Brython) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/brython/3.12.0/brython.min.js"></script>

    <style>
        :root {
            --pink-soft: #ffe8f0;
            --pink-mid: #ffc4d6;
            --pink-deep: #c2185b;
            --pink-neon: #ff2a75;
            --gold-warm: #ffd57e;
            --text-dark: #431227;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;
            background: radial-gradient(circle at 50% 35%, #fff7fa 0%, var(--pink-soft) 48%, var(--pink-mid) 100%);
            transition: background 1.8s ease;
        }

        /* Khung kết xuất 3D PBR thời gian thực */
        #webgl-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: auto;
        }

        /* Khung hạt bụi siêu nhỏ 3D ở Trang 2 */
        #particle-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        /* Hệ thống 5 Trang */
        .page {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            padding: 6vh 20px 8vh 20px;
        }

        .page.active {
            opacity: 1;
            visibility: visible;
        }

        /* Khung tiêu đề kính mờ */
        .glass-pill {
            background: rgba(255, 255, 255, 0.62);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255, 255, 255, 0.88);
            box-shadow: 0 12px 32px rgba(194, 24, 91, 0.15), inset 0 1px 2px rgba(255, 255, 255, 0.9);
            padding: 12px 28px;
            border-radius: 40px;
            text-align: center;
            transition: all 0.6s ease;
        }

        .glass-pill h2 {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(1.6rem, 4.2vw, 2.3rem);
            color: #ad1457;
            letter-spacing: 0.4px;
        }

        .hint-3d {
            font-size: 0.84rem;
            color: #880e4f;
            margin-top: 4px;
            font-weight: 600;
            opacity: 0.85;
        }

        /* Giao diện kính mờ ban đêm cho Trang 5 */
        .glass-pill.night-mode {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 12px 35px rgba(194, 24, 91, 0.18), inset 0 1px 3px rgba(255, 255, 255, 0.95);
        }

        .glass-pill.night-mode h2 {
            color: #ad1457;
            text-shadow: 0 0 12px rgba(255, 64, 129, 0.25);
        }

        .glass-pill.night-mode .hint-3d {
            color: #880e4f;
        }

        /* Nút bấm màu hồng đậm phát sáng nhẹ bên ngoài viền */
        .glow-btn {
            pointer-events: auto;
            position: relative;
            background: linear-gradient(135deg, #f01e68 0%, #c2185b 55%, #880e4f 100%);
            color: #ffffff;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: clamp(1rem, 3.2vw, 1.2rem);
            padding: 15px 36px;
            border-radius: 50px;
            border: 2px solid rgba(255, 210, 228, 0.92);
            cursor: pointer;
            box-shadow: 
                0 0 18px rgba(255, 42, 117, 0.78),
                0 0 38px rgba(194, 24, 91, 0.5),
                0 10px 25px rgba(136, 14, 79, 0.35),
                inset 0 2px 12px rgba(255, 255, 255, 0.42);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            letter-spacing: 0.4px;
            animation: neonBorderPulse 2s infinite alternate;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .glow-btn:hover {
            transform: translateY(-3px) scale(1.04);
        }

        .glow-btn:active {
            transform: translateY(1px) scale(0.97);
        }

        @keyframes neonBorderPulse {
            0% {
                box-shadow: 0 0 14px rgba(255, 42, 117, 0.65), 0 0 28px rgba(194, 24, 91, 0.35), inset 0 0 10px rgba(255, 255, 255, 0.3);
            }
            100% {
                box-shadow: 0 0 26px rgba(255, 42, 117, 0.98), 0 0 54px rgba(255, 105, 160, 0.75), inset 0 0 18px rgba(255, 255, 255, 0.55);
            }
        }

        /* Mũi tên nhấp nháy phát sáng ở Trang 2 */
        .blinking-arrows {
            display: inline-flex;
            align-items: center;
            font-size: 1.3em;
            line-height: 1;
        }

        .arrow-item {
            display: inline-block;
            color: #ffffff;
            text-shadow: 0 0 10px #ffffff, 0 0 20px #ff80ab, 0 0 30px #ff2a75;
            animation: arrowGlow 1.1s infinite;
        }

        .arrow-item:nth-child(2) { animation-delay: 0.18s; }
        .arrow-item:nth-child(3) { animation-delay: 0.36s; }

        @keyframes arrowGlow {
            0%, 100% { opacity: 0.2; transform: translateX(0); }
            50% { opacity: 1; transform: translateX(4px); filter: drop-shadow(0 0 8px #fff); }
        }

        #page-2 {
            justify-content: flex-end;
        }

        #btn-page-2 {
            opacity: 0;
            transform: translateY(25px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        #btn-page-2.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Trang 4: Bức thư tâm tình gõ chữ từ từ */
        #page-4 {
            z-index: 25;
            justify-content: center;
            padding: 15px;
            perspective: 1200px;
        }

        .letter-card {
            pointer-events: auto;
            width: 100%;
            max-width: 650px;
            max-height: 88vh;
            overflow-y: auto;
            background: linear-gradient(165deg, rgba(255, 253, 254, 0.96) 0%, rgba(255, 240, 246, 0.96) 100%);
            backdrop-filter: blur(16px);
            border-radius: 26px;
            padding: clamp(20px, 4.5vw, 38px);
            border: 2px solid rgba(255, 190, 215, 0.95);
            box-shadow: 
                0 25px 70px rgba(136, 14, 79, 0.28),
                0 0 45px rgba(255, 128, 171, 0.45),
                inset 0 0 30px rgba(255, 255, 255, 0.95);
            transform: rotateX(18deg) scale(0.82) translateY(40px);
            opacity: 0;
            transition: all 1s cubic-bezier(0.22, 1, 0.36, 1);
            scroll-behavior: smooth;
        }

        .letter-card::-webkit-scrollbar { width: 6px; }
        .letter-card::-webkit-scrollbar-thumb { background: #f48fb1; border-radius: 10px; }

        #page-4.active .letter-card {
            transform: rotateX(0deg) scale(1) translateY(0);
            opacity: 1;
        }

        .letter-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .letter-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ff4081, #ad1457);
            color: #fff;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 12px rgba(233, 30, 99, 0.3);
        }

        .skip-type-btn {
            background: rgba(216, 27, 96, 0.1);
            color: #ad1457;
            border: 1px solid rgba(216, 27, 96, 0.3);
            padding: 4px 12px;
            border-radius: 15px;
            font-family: 'Quicksand', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .skip-type-btn:hover {
            background: rgba(216, 27, 96, 0.2);
        }

        .letter-title {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(1.9rem, 5vw, 2.6rem);
            color: #ad1457;
            margin-bottom: 14px;
            line-height: 1.25;
        }

        .letter-divider {
            width: 90px;
            height: 3px;
            background: linear-gradient(90deg, #ff4081, #ffd57e, transparent);
            margin-bottom: 18px;
            border-radius: 3px;
        }

        .letter-body p {
            color: var(--text-dark);
            font-size: clamp(0.95rem, 2.5vw, 1.05rem);
            line-height: 1.78;
            margin-bottom: 15px;
            text-align: justify;
            font-weight: 500;
            min-height: 1.2em;
        }

        .letter-highlight {
            background: rgba(255, 198, 218, 0.38);
            border-left: 4px solid #d81b60;
            padding: 13px 16px;
            border-radius: 0 14px 14px 0;
            margin: 16px 0;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .letter-highlight.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Con trỏ gõ chữ lấp lánh */
        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background-color: #d81b60;
            margin-left: 3px;
            vertical-align: text-bottom;
            animation: blinkCursor 0.7s infinite;
        }

        @keyframes blinkCursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .python-stat-box {
            background: linear-gradient(135deg, rgba(255, 240, 246, 0.92), rgba(255, 224, 236, 0.92));
            border: 1.5px dashed #d81b60;
            border-radius: 14px;
            padding: 12px 15px;
            margin-top: 14px;
            font-size: 0.92rem;
            color: #880e4f;
            line-height: 1.6;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.7s ease;
        }

        .python-stat-box.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .letter-footer {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            border-top: 1px dashed rgba(216, 27, 96, 0.35);
            padding-top: 16px;
            opacity: 0;
            transform: translateY(12px);
            transition: all 0.8s ease;
        }

        .letter-footer.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .signature {
            font-family: 'Dancing Script', cursive;
            font-size: 1.55rem;
            color: #c2185b;
            align-self: flex-end;
        }

        /* Trang 5: Đại Tiệc Ánh Sáng 3D Cuối Cùng */
        .page5-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .wish-banner {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            color: #c2185b;
            text-shadow: 0 0 15px rgba(255, 64, 129, 0.35), 0 0 25px rgba(255, 213, 126, 0.4);
            text-align: center;
            opacity: 1;
            transform: scale(1);
            padding: 10px 24px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 40px;
            border: 1.5px solid rgba(255, 255, 255, 0.88);
            box-shadow: 0 12px 32px rgba(194, 24, 91, 0.15);
        }

        #audio-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 60;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(8px);
            border: 1.5px solid rgba(233, 30, 99, 0.45);
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(216, 27, 96, 0.25);
        }
    </style>
</head>
<body onload="brython()">

    <!-- Nút điều khiển âm thanh -->
    <button id="audio-toggle" title="Bật/Tắt hiệu ứng âm thanh">🔔</button>

    <!-- Khung 3D PBR -->
    <div id="webgl-container"></div>

    <!-- Khung hạt bụi siêu nhỏ (Trang 2) -->
    <canvas id="particle-canvas"></canvas>

    <!-- ================= TRANG 1: SÂN KHẤU NGỌC TRAI & PHA LÊ 3D ================= -->
    <div id="page-1" class="page active">
        <div class="glass-pill">
            <h2>Không Gian Kỷ Niệm Tuổi 18 ✨</h2>
        </div>
        <button id="btn-page-1" class="glow-btn">
            <span>Bắt đầu</span>
        </button>
    </div>

    <!-- ================= TRANG 2: HẠT BỤI SIÊU NHỎ GHÉP CHỮ 3D ================= -->
    <div id="page-2" class="page">
        <div></div>
        <button id="btn-page-2" class="glow-btn">
            <span>Tiếp tục</span>
            <span class="blinking-arrows">
                <span class="arrow-item">❯</span>
                <span class="arrow-item">❯</span>
                <span class="arrow-item">❯</span>
            </span>
        </button>
    </div>

    <!-- ================= TRANG 3: HỘP QUÀ LỤA 3D RỖNG RUỘT CHÂN THẬT ================= -->
    <div id="page-3" class="page">
        <div class="glass-pill">
            <h2>Món quà dành riêng cho bạn 🎁</h2>
        </div>
        <button id="btn-open-gift" class="glow-btn">
            <span>Mở hộp quà ngay</span>
        </button>
    </div>

    <!-- ================= TRANG 4: BỨC THƯ TÂM TÌNH (HIỆN CHỮ TỪ TỪ) ================= -->
    <div id="page-4" class="page">
        <div class="letter-card" id="letter-scroll-box">
            <div class="letter-top-bar">
                <span class="letter-badge">Happy 18th Birthday</span>
                <button id="btn-skip-typing" class="skip-type-btn">Hiện nhanh toàn bộ ⏩</button>
            </div>
            <h1 class="letter-title">Gửi cô gái tuổi 18 rực rỡ nhất hôm nay 🌸</h1>
            <div class="letter-divider"></div>

            <div class="letter-body">
                <!-- Đoạn 1: Lời chúc tuổi 18 (Gõ chữ từ từ) -->
                <p id="type-p1"></p>

                <!-- Đoạn 2: Học tập, ăn uống, sinh hoạt an toàn (Gõ chữ từ từ) -->
                <div class="letter-highlight" id="highlight-box">
                    <p id="type-p2" style="margin-bottom: 0;"></p>
                </div>

                <!-- Đoạn 3 & 4: Lời chúc & tâm tình -->
                <p id="type-p3"></p>

            <div class="letter-footer" id="letter-footer-box">

    <!-- ================= TRANG 5: SÂN KHẤU BÁNH KEM & KHÔNG GIAN HỒNG LẤP LÁNH ================= -->
    <div id="page-5" class="page">
        <div class="glass-pill night-mode">
            <h2>Thiên Đường Ước Nguyện Tuổi 18 ✨</h2>
        </div>

        <div class="page5-controls">
            <div id="wish-message" class="wish-banner">
                ✨ Chúc mọi điều ước tuổi 18 của bạn đều trở thành hiện thực! ✨
            </div>
        </div>
    </div>

    <!-- =========================================================================
         NGÔN NGỮ 1: GLSL (OPEN-GL SHADING LANGUAGE) CHẠY TRÊN CARD ĐỒ HỌA GPU
         ========================================================================= -->
    <script id="haloVertexShader" type="x-shader/x-vertex">
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    </script>

    <script id="haloFragmentShader" type="x-shader/x-fragment">
        uniform float uTime;
        uniform vec3 uColorInner;
        uniform vec3 uColorOuter;
        varying vec2 vUv;

        void main() {
            vec2 center = vUv - vec2(0.5);
            float dist = length(center) * 2.0;
            float wave = sin(dist * 10.0 - uTime * 3.0) * 0.04;
            float alpha = smoothstep(1.0, 0.05, dist + wave);
            float pulse = 0.75 + 0.25 * sin(uTime * 2.5);
            vec3 finalColor = mix(uColorInner, uColorOuter, dist);
            gl_FragColor = vec4(finalColor, alpha * 0.55 * pulse);
        }
    </script>

    <!-- =========================================================================
         NGÔN NGỮ 2: PYTHON (CHẠY TRỰC TIẾP TRÊN TRÌNH DUYỆT QUA BRYTHON)
         ========================================================================= -->
    <script type="text/python">
from browser import document

# Tính toán chính xác hành trình 18 năm bằng Python
years = 18
leap_days = 4
total_days = years * 365 + leap_days
total_hours = total_days * 24
total_minutes = total_hours * 60

milestone_box = document.getElementById("python-milestone")
if milestone_box:
    milestone_box.innerHTML = (
        f"✨ <b>Góc nhỏ tính bằng ngôn ngữ Python:</b> Tính đến cột mốc tuổi {years} hôm nay, "
        f"bạn đã đi qua hành trình <b>{total_days:,} ngày</b> (tương đương <b>{total_hours:,} giờ</b> "
        f"và <b>{total_minutes:,} phút</b>) thanh xuân thật đẹp. Hãy bấm nút bên dưới để mở bầu trời ước nguyện dành riêng cho bạn nhé!"
    )
    </script>

    <!-- =========================================================================
         NGÔN NGỮ 3: JAVASCRIPT (ES6+) + THREE.JS PBR ENGINE + WEB AUDIO API
         ========================================================================= -->
    <script>
        /* -------------------------------------------------------------------------
           1. HỆ THỐNG HIỆU ỨNG ÂM THANH (SOUND EFFECTS - SFX) WEB AUDIO API
           ------------------------------------------------------------------------- */
        class SoundEffectsManager {
            constructor() {
                this.ctx = null;
                this.isSoundEnabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx.state === 'suspended') this.ctx.resume();
            }

            // Âm thanh gõ chữ êm dịu ở Trang 4
            playTypeTick() {
                if (!this.isSoundEnabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(850 + Math.random() * 250, now);
                g.gain.setValueAtTime(0.015, now);
                g.gain.exponentialRampToValueAtTime(0.0001, now + 0.03);
                osc.connect(g);
                g.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.035);
            }

            // Hiệu ứng âm thanh chuông pha lê lấp lánh (Magic Chime) khi chuyển cảnh & tương tác
            playMagicChime() {
                if (!this.isSoundEnabled) return;
                this.init();
                [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98].forEach((f, i) => {
                    setTimeout(() => {
                        if (!this.ctx || !this.isSoundEnabled) return;
                        const now = this.ctx.currentTime;
                        const osc = this.ctx.createOscillator();
                        const g = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(f, now);
                        g.gain.setValueAtTime(0.07, now);
                        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.85);
                        osc.connect(g);
                        g.connect(this.ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.9);
                    }, i * 65);
                });
            }

            // Hiệu ứng âm thanh ánh sao lấp lánh (Sparkle Chime)
            playSparkleSound() {
                if (!this.isSoundEnabled) return;
                this.init();
                if (!this.ctx) return;
                for (let i = 0; i < 4; i++) {
                    setTimeout(() => {
                        if (!this.ctx || !this.isSoundEnabled) return;
                        const t = this.ctx.currentTime;
                        const spOsc = this.ctx.createOscillator();
                        const spGain = this.ctx.createGain();
                        spOsc.type = 'sine';
                        spOsc.frequency.setValueAtTime(1200 + Math.random() * 1000, t);
                        spGain.gain.setValueAtTime(0.04, t);
                        spGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
                        spOsc.connect(spGain);
                        spGain.connect(this.ctx.destination);
                        spOsc.start(t);
                        spOsc.stop(t + 0.38);
                    }, i * 65);

        function createSparkleTexture() {
            const c = document.createElement('canvas');

            const ctx = c.getContext('2d');
            ctx.clearRect(0, 0, 128, 128);

            const cx = 64, cy = 64;
            // Ánh hào quang tỏa tròn ở tâm
            const radGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 32);
            radGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            radGrad.addColorStop(0.3, 'rgba(255, 220, 240, 0.8)');
            radGrad.addColorStop(1, 'rgba(255, 180, 210, 0)');
            ctx.fillStyle = radGrad;
            ctx.beginPath();
            ctx.arc(cx, cy, 32, 0, Math.PI * 2);
            ctx.fill();

            // 4 tia sáng kim cương nhọn hoắt lấp lánh
            function drawRay(angle, length, width) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle);
                const rayGrad = ctx.createLinearGradient(0, -length, 0, length);
                rayGrad.addColorStop(0, 'rgba(255,255,255,0)');
                rayGrad.addColorStop(0.5, 'rgba(255,255,255,1)');
                rayGrad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = rayGrad;
                ctx.beginPath();
                ctx.moveTo(-width / 2, 0);
                ctx.lineTo(0, -length);
                ctx.lineTo(width / 2, 0);
                ctx.lineTo(0, length);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }

            drawRay(0, 58, 7);
            drawRay(Math.PI / 2, 58, 7);
            drawRay(Math.PI / 4, 30, 4);
            drawRay(-Math.PI / 4, 30, 4);

            return new THREE.CanvasTexture(c);

        /* -------------------------------------------------------------------------

        const pCanvas = document.getElementById('particle-canvas');

        let dustParticles = [];
        let dustAnimId = null;
        let isPage2Active = false;
        const pointer2D = { x: -9999, y: -9999, radius: 75 };

        window.addEventListener('mousemove', e => { pointer2D.x = e.clientX; pointer2D.y = e.clientY; });
        window.addEventListener('touchmove', e => {
            if (e.touches.length > 0) {
                pointer2D.x = e.touches[0].clientX;
                pointer2D.y = e.touches[0].clientY;
            }
        });
        window.addEventListener('touchend', () => { pointer2D.x = -9999; pointer2D.y = -9999; });

        function initMicroDustText() {
            pCanvas.width = window.innerWidth;
            pCanvas.height = window.innerHeight;
            dustParticles = [];

            const off = document.createElement('canvas');
            off.width = pCanvas.width;
            off.height = pCanvas.height;
            const oCtx = off.getContext('2d');

            const isMobile = pCanvas.width < 680;
            const cx = pCanvas.width / 2;
            const cy = pCanvas.height * 0.42;

            oCtx.fillStyle = '#ffffff';
            oCtx.textAlign = 'center';
            oCtx.textBaseline = 'middle';

            if (isMobile) {
                const fs1 = Math.floor(pCanvas.width * 0.115);
                const fs2 = Math.floor(pCanvas.width * 0.085);
                oCtx.font = `700 ${fs1}px "Quicksand", sans-serif`;
                oCtx.fillText('CHÚC MỪNG', cx, cy - fs1 * 1.15);
                oCtx.fillText('SINH NHẬT', cx, cy);
                oCtx.font = `700 ${fs2}px "Quicksand", sans-serif`;
                oCtx.fillText('✨ TUỔI 18 RỰC RỠ ✨', cx, cy + fs1 * 1.25);
            } else {
                const fs1 = Math.min(Math.floor(pCanvas.width * 0.062), 78);
                const fs2 = Math.min(Math.floor(pCanvas.width * 0.045), 54);
                oCtx.font = `700 ${fs1}px "Quicksand", sans-serif`;
                oCtx.fillText('CHÚC MỪNG SINH NHẬT', cx, cy - fs1 * 0.65);
                oCtx.font = `700 ${fs2}px "Quicksand", sans-serif`;
                oCtx.fillText('✨ TUỔI 18 RỰC RỠ ✨', cx, cy + fs1 * 0.65);
            }

            const data = oCtx.getImageData(0, 0, off.width, off.height).data;
            const step = isMobile ? 3 : 4;
            const colors = ['#880e4f', '#ad1457', '#d81b60', '#e91e63', '#ff2a75', '#ff6090'];

            for (let y = 0; y < off.height; y += step) {
                for (let x = 0; x < off.width; x += step) {
                    if (data[(y * off.width + x) * 4 + 3] > 140) {
                        const angle = Math.random() * Math.PI * 2;
                        const dist = Math.random() * Math.max(off.width, off.height) + 150;
                        dustParticles.push({
                            x: cx + Math.cos(angle) * dist,
                            y: cy + Math.sin(angle) * dist,
                            z: Math.random() * 400 + 100,
                            tx: x,
                            ty: y,
                            size: Math.random() * 1.55 + 0.85,
                            color: colors[Math.floor(Math.random() * colors.length)],
                            ease: Math.random() * 0.045 + 0.035,
                            phase: Math.random() * Math.PI * 2
                        });
                    }
                }
            }
        }

        function animateMicroDust() {
            if (!isPage2Active) return;
            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);

            for (let i = 0; i < dustParticles.length; i++) {
                const p = dustParticles[i];
                p.x += (p.tx - p.x) * p.ease;
                p.y += (p.ty - p.y) * p.ease;
                p.z += (0 - p.z) * p.ease;

                const dx = p.x - pointer2D.x;
                const dy = p.y - pointer2D.y;
                const d = Math.sqrt(dx * dx + dy * dy);
                if (d < pointer2D.radius) {
                    const f = (pointer2D.radius - d) / pointer2D.radius;
                    p.x += (dx / d) * f * 11;
                    p.y += (dy / d) * f * 11;
                }

                p.phase += 0.06;
                const perspectiveScale = 300 / (300 + p.z);
                const r = Math.max(0.45, (p.size + Math.sin(p.phase) * 0.35) * perspectiveScale);

                pCtx.fillStyle = p.color;
                pCtx.beginPath();
                pCtx.arc(p.x, p.y, r, 0, Math.PI * 2);
                pCtx.fill();
            }

            dustAnimId = requestAnimationFrame(animateMicroDust);
        }

        function finishLetterImmediately() {
            isTypingSkipped = true;

            document.querySelectorAll('.typing-cursor').forEach(c => c.remove());

            letterParagraphs.forEach(item => {
                if (item.boxId) document.getElementById(item.boxId).classList.add('visible');

            });

            const el = document.getElementById('python-milestone');

            btnSkipTyping.style.display = 'none';

                letterScrollBox.scrollTop = letterScrollBox.scrollHeight;

        function startLetterTypewriter() {
            let pIndex = 0;
            let charIndex = 0;
            const cursorSpan = document.createElement('span');
            cursorSpan.className = 'typing-cursor';

            function typeStep() {
                if (isTypingSkipped) return;
                if (pIndex >= letterParagraphs.length) {
                    cursorSpan.remove();
                    const el = document.getElementById('python-milestone');
            if (el) el.classList.add('visible');
                    document.getElementById('letter-footer-box').classList.add('visible');
                    btnSkipTyping.style.display = 'none';
                    letterScrollBox.scrollTop = letterScrollBox.scrollHeight;
                    return;
                }

                const currentItem = letterParagraphs[pIndex];
                const targetEl = document.getElementById(currentItem.id);

                if (charIndex === 0 && currentItem.boxId) {
                    document.getElementById(currentItem.boxId).classList.add('visible');
                }

                charIndex++;
                targetEl.textContent = currentItem.text.slice(0, charIndex);
                targetEl.appendChild(cursorSpan);

                if (charIndex % 4 === 0) {
                    musicBox.playTypeTick();
                    letterScrollBox.scrollTop = letterScrollBox.scrollHeight;
                }

                if (charIndex < currentItem.text.length) {
                    const lastChar = currentItem.text[charIndex - 1];
                    const delay = (lastChar === '.' || lastChar === '!' || lastChar === ',') ? 95 : 22;
                    typingTimer = setTimeout(typeStep, delay);
                } else {
                    pIndex++;
                    charIndex = 0;
                    typingTimer = setTimeout(typeStep, 320);
                }
            }

            setTimeout(typeStep, 600);

            const tl = gsap.timeline();
            tl.to(giftStageGroup.rotation, { y: Math.PI / 8, duration: 0.4 })
              .to(giftStageGroup.rotation, { z: 0.06, duration: 0.07, yoyo: true, repeat: 5 })
              .to(giftStageGroup.rotation, { z: 0, duration: 0.07 })
              .to(lidGroup.position, { y: 3.8, z: -2.8, duration: 1.15, ease: "power3.out" }, "+=0.05")
              .to(lidGroup.rotation, { x: -Math.PI / 2.2, z: 0.18, duration: 1.15, ease: "power3.out" }, "<")
              .to(innerBoxLight, { intensity: 8, duration: 0.7 }, "<")
              .to(letter3DGroup.position, { y: 2.35, z: 0.8, duration: 1.25, ease: "back.out(1.4)" }, "-=0.65")
              .to(letter3DGroup.rotation, { y: Math.PI * 2, x: -0.15, duration: 1.25, ease: "power2.out" }, "<")
              .to(camera.position, { y: 2.1, z: 6.5, duration: 1.1, ease: "power2.inOut" }, "-=0.5")
              .add(() => {
                  currentStage = 4;
                  page4.classList.add('active');
                  startLetterTypewriter();
              }, "-=0.35");
        }

        btnOpenGift.addEventListener('click', () => {
            if (currentStage === 3 && !isGiftOpened) openHollowGiftBox();
        });

        // TRANG 4 -> TRANG 5 (SÂN KHẤU BÁNH KEM & VƯƠNG QUỐC HỒNG LẤP LÁNH)
        btnToPage5.addEventListener('click', () => {
            musicBox.playMagicChime();
            currentStage = 5;
            page4.classList.remove('active');

            // Đồng bộ phông nền hồng sang trọng, tươi sáng giống Trang 1
            document.body.style.background = 'radial-gradient(circle at 50% 35%, #fff7fa 0%, var(--pink-soft) 48%, var(--pink-mid) 100%)';
            haloUniforms.uColorInner.value.setHex(0xff5c97);
            haloUniforms.uColorOuter.value.setHex(0xffe6f0);

            // Đưa hộp quà xuống và nâng Sân khấu Bánh Kem + Vương quốc lấp lánh lên
            gsap.to(giftStageGroup.position, { y: -15, duration: 1.1, ease: "power2.in", onComplete: () => { giftStageGroup.visible = false; } });

            finaleStageGroup.visible = true;
            gsap.to(camera.position, { x: 0, y: 1.8, z: 9.2, duration: 1.6, ease: "power3.out", onUpdate: () => camera.lookAt(0, 0.3, 0) });
            gsap.to(finaleStageGroup.position, { y: 0, duration: 1.6, ease: "back.out(1.2)" });
            gsap.fromTo(cakeGroup.rotation, { y: -Math.PI }, { y: 0, duration: 1.8, ease: "power3.out" });

            setTimeout(() => {
                page5.classList.add('active');
            }, 700);
        });

        // Tương tác vuốt xoay 360 độ ở Trang 1, Trang 3, Trang 5
        const raycaster = new THREE.Raycaster();
        const pointer3D = new THREE.Vector2();
        let isDragging = false;
        let prevX = 0;
        let dragDistance = 0;

        window.addEventListener('pointerdown', e => {
            isDragging = true;
            prevX = e.clientX;
            dragDistance = 0;
        });

        window.addEventListener('pointermove', e => {
            if (!isDragging) return;
            const dx = e.clientX - prevX;
            dragDistance += Math.abs(dx);
            prevX = e.clientX;

            if (currentStage === 1 && stage1Group.visible) {
                stage1Group.rotation.y += dx * 0.008;
            } else if (currentStage === 3 && !isGiftOpened) {
                giftStageGroup.rotation.y += dx * 0.009;
            } else if (currentStage === 5 && finaleStageGroup.visible) {
                cakeGroup.rotation.y += dx * 0.01;
                galaxyPoints.rotation.y += dx * 0.003;
            }
        });

        window.addEventListener('pointerup', e => {
            isDragging = false;
            if (dragDistance < 10) {
                if (currentStage === 3 && !isGiftOpened) {
                    pointer3D.x = (e.clientX / window.innerWidth) * 2 - 1;
                    pointer3D.y = -(e.clientY / window.innerHeight) * 2 + 1;
                    raycaster.setFromCamera(pointer3D, camera);
                    const hits = raycaster.intersectObjects(giftStageGroup.children, true);
                    if (hits.length > 0) openHollowGiftBox();
                }
            }
        });

        /* -------------------------------------------------------------------------
           9. VÒNG LẶP KẾT XUẤT 3D PBR 60FPS
           ------------------------------------------------------------------------- */
        const clock = new THREE.Clock();

        function animate3DScene() {
            requestAnimationFrame(animate3DScene);
            const t = clock.getElapsedTime();
            haloUniforms.uTime.value = t;

            // Trang 1: Diễn hoạt Pha Lê & Ngọc Trai
            if (stage1Group.visible) {
                mainCrystal.rotation.y = t * 0.6;
                mainCrystal.rotation.x = Math.sin(t * 0.8) * 0.25;
                orbitRing1.rotation.z = t * 0.5;
                orbitRing2.rotation.y = -t * 0.45;
                crystalCoreGroup.position.y = 0.25 + Math.sin(t * 2) * 0.1;

                floatingOrbs.forEach(orb => {
                    const curAngle = orb.angle + t * orb.speed * 0.4;
                    orb.mesh.position.x = Math.cos(curAngle) * orb.radius;
                    orb.mesh.position.z = Math.sin(curAngle) * orb.radius;
                    orb.mesh.position.y = orb.baseY + Math.sin(t * 2 + orb.phase) * 0.22;
                });
            }

            // Trang 3: Diễn hoạt Hộp Quà 3D
            if (giftStageGroup.visible && !isGiftOpened && !isDragging) {
                giftStageGroup.rotation.y += 0.0045;
                giftStageGroup.position.y = -0.6 + Math.sin(t * 1.8) * 0.08;
            }

            if (isGiftOpened && giftStageGroup.visible) {
                letter3DGroup.position.y = 2.35 + Math.sin(t * 2.2) * 0.08;
            }

            // Trang 5: Diễn hoạt Bánh Kem 3D, Lửa Nến, Ngân Hà & Đèn Trời
            if (finaleStageGroup.visible) {
                if (!isDragging) {
                    cakeGroup.rotation.y += 0.004;
                }
                galaxyPoints.rotation.y = t * 0.05;

                // Ngọn lửa nến lung lay chân thật
                if (!isCandleBlown && flameGroup.visible) {
                    flameGroup.scale.x = 1 + Math.sin(t * 18) * 0.08;
                    flameGroup.scale.y = 1 + Math.cos(t * 14) * 0.1;
                    flameGroup.rotation.z = Math.sin(t * 10) * 0.06;
                    candleLight.intensity = 6.0 + Math.sin(t * 20) * 1.2;
                }

                // Đèn trời bay lên cao
                skyLanterns.forEach(item => {
                    item.group.position.y += item.speedY;
                    item.group.position.x += Math.sin(t * item.swaySpeed + item.phase) * 0.004;
                    if (item.group.position.y > 7.5) {
                        item.group.position.y = -5.5;
                    }
                });

                // Cập nhật mưa sao & bụi sáng lấp lánh (Magic Sparkles)
                if (magicSparkles) {
                    const spPos = magicSparkles.geometry.attributes.position.array;
                    magicSparkles.rotation.y = t * 0.02;
                    for (let i = 0; i < sparkleCount; i++) {
                        const d = sparkleData[i];
                        spPos[i * 3 + 1] += d.speedY;
                        if (spPos[i * 3 + 1] > 8.0) {
                            spPos[i * 3 + 1] = -6.0;
                        }
                    }
                    magicSparkles.geometry.attributes.position.needsUpdate = true;
                    sparkleMat.size = 0.55 + Math.sin(t * 3.5) * 0.18;
                }
                // Cập nhật mưa hạt sao lấp lánh rơi chầm chậm tự nhiên
                if (fallingStarsPoints) {
                    const fPos = fallingStarsPoints.geometry.attributes.position.array;
                    for (let i = 0; i < fallingStarsCount; i++) {
                        const d = fallingStarsData[i];
                        fPos[i * 3 + 1] -= d.speedY;
                        fPos[i * 3] += Math.sin(t * d.swaySpeed + d.phase) * 0.003;
                        if (fPos[i * 3 + 1] < -4.5) {
                            fPos[i * 3 + 1] = 8.5;
                        }
                    }
                    fallingStarsPoints.geometry.attributes.position.needsUpdate = true;
                }

                // Diễn hoạt vòng quỹ đạo vàng xoay quanh bánh kem
                cakeGoldOrbit1.rotation.z = t * 0.4;
                cakeGoldOrbit2.rotation.y = -t * 0.35;

                // Diễn hoạt 16 hạt ngọc trai & tinh thể pha lê bay lơ lửng quanh bánh kem
                cakeFloatingOrbs.forEach(orb => {
                    const curAngle = orb.angle + t * orb.speed * 0.3;
                    orb.mesh.position.x = Math.cos(curAngle) * orb.radius;
                    orb.mesh.position.z = Math.sin(curAngle) * orb.radius;
                    orb.mesh.position.y = orb.baseY + Math.sin(t * 1.8 + orb.phase) * 0.18;
                });

                // Diễn hoạt 36 cánh hoa hồng pha lê 3D bay lượn và xoay tà tà tự nhiên
                rosePetals.forEach(p => {
                    p.mesh.position.y -= p.speedY;
                    p.mesh.position.x += Math.sin(t * p.swaySpeed + p.phase) * p.swayAmp;
                    p.mesh.position.z += Math.cos(t * p.swaySpeed * 0.8 + p.phase) * p.swayAmp;
                    p.mesh.rotation.x += p.rotSpeedX;
                    p.mesh.rotation.y += p.rotSpeedY;

                    if (p.mesh.position.y < -5.0) {
                        p.mesh.position.y = 5.2;
                    }
                });
            }

            bokehPoints.rotation.y = t * 0.035;
            renderer.render(scene, camera);
        }

        animate3DScene();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (isPage2Active) initMicroDustText();
        });
    </script>
</body>
