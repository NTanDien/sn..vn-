<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vũ Trụ Dịu Dàng Dành Riêng Cho Bạn ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Dancing+Script:wght@600;700&family=Montserrat:wght@700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #030104;
      overflow: hidden;
      font-family: 'Quicksand', sans-serif;
      color: #fff;
    }

    /* 1. MÀN HÌNH QUÉT QR TRÁI TIM ĐỎ */
    #qr-intro-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1a0308 0%, #050102 75%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease;
    }
    .scanner-viewfinder {
      width: 280px;
      height: 280px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .corner {
      position: absolute;
      width: 34px;
      height: 34px;
      border-color: rgba(255, 255, 255, 0.85);
      border-style: solid;
      border-width: 0;
      border-radius: 6px;
    }
    .corner.tl { top: 0; left: 0; border-top-width: 3.5px; border-left-width: 3.5px; }
    .corner.tr { top: 0; right: 0; border-top-width: 3.5px; border-right-width: 3.5px; }
    .corner.bl { bottom: 0; left: 0; border-bottom-width: 3.5px; border-left-width: 3.5px; }
    .corner.br { bottom: 0; right: 0; border-bottom-width: 3.5px; border-right-width: 3.5px; }

    .red-heart-qr-wrap {
      position: relative;
      width: 260px;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 22px rgba(255, 20, 50, 0.75));
      animation: heartBeat 1.5s infinite ease-in-out;
    }
    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .red-heart-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #heart-qr-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) translateY(9.5px) rotate(45deg);
      transform-origin: center center;
      background: transparent;
      padding: 0;
      border: none;
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 8px rgba(255, 30, 60, 0.7));
    }
    #heart-qr-box canvas, #heart-qr-box svg {
      background: transparent !important;
      display: block;
    }
    .qr-hint {
      margin-top: 28px;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.75);
      letter-spacing: 0.5px;
    }

    /* 2. MÀN HÌNH "Đang tải..." */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #040205;
      z-index: 90;
      display: none;
      align-items: center;
      justify-content: center;
      font-family: 'Dancing Script', cursive;
      font-size: 1.8rem;
      color: #fff;
      letter-spacing: 1px;
    }

    /* 3. KHÔNG GIAN 3D WEBGL CHÍNH */
    #webgl-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    /* Hào quang hồng ở tâm Quả Cầu Trái Tim */
    #sphere-core-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 340px;
      height: 340px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255, 70, 150, 0.45) 0%, rgba(255, 20, 100, 0.15) 45%, transparent 72%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    .ui-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* NÚT "Giữ để bắt đầu" */
    .hold-container {
      position: absolute;
      bottom: 9%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .hold-container.visible {
      opacity: 1;
    }
    .hold-label {
      font-family: 'Dancing Script', cursive;
      font-size: 1.15rem;
      color: #ff9ec4;
      text-shadow: 0 0 10px rgba(255, 80, 150, 0.9);
    }
    .ring-wrapper {
      position: relative;
      width: 54px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .progress-ring {
      transform: rotate(-90deg);
      width: 54px;
      height: 54px;
    }
    .progress-ring__bg {
      fill: transparent;
      stroke: rgba(255, 130, 180, 0.3);
      stroke-width: 2.5;
    }
    .progress-ring__circle {
      fill: transparent;
      stroke: #ff4081;
      stroke-width: 3;
      stroke-dasharray: 144;
      stroke-dashoffset: 144;
      stroke-linecap: round;
      filter: drop-shadow(0 0 6px #ff4081);
    }

    /* ẢNH BÁNH KEM SINH NHẬT */
    .cake-photo-box {
      position: absolute;
      width: 78%;
      max-width: 310px;
      aspect-ratio: 3/4;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
      opacity: 0;
      transform: scale(0.86);
      transition: opacity 1.1s ease, transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }
    .cake-photo-box.show {
      opacity: 1;
      transform: scale(1);
    }
    .cake-photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* NÚT TIẾP TỤC CHUYỂN BƯỚC */
    .next-step-btn {
      position: absolute;
      bottom: 7.5%;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      background: rgba(255, 30, 80, 0.3);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 140, 180, 0.8);
      color: #fff;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 0.96rem;
      letter-spacing: 0.8px;
      padding: 11px 28px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(255, 50, 100, 0.55), inset 0 0 10px rgba(255, 200, 220, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
      animation: nextBtnPulse 1.8s infinite ease-in-out;
    }
    .next-step-btn.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
    .next-step-btn:active {
      transform: translateX(-50%) scale(0.95);
    }
    @keyframes nextBtnPulse {
      0%, 100% { box-shadow: 0 0 18px rgba(255, 40, 90, 0.45); }
      50% { box-shadow: 0 0 32px rgba(255, 70, 130, 0.9); }
    }

    /* DÒNG CHỮ "Click vào nhé" Ở ĐÁY MÀN HÌNH */
    .click-hint-bottom {
      position: absolute;
      bottom: 6%;
      font-family: 'Dancing Script', cursive;
      font-size: 1.2rem;
      color: rgba(255, 230, 240, 0.9);
      text-shadow: 0 0 8px rgba(255, 100, 160, 0.8);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      cursor: pointer;
    }
    .click-hint-bottom.show {
      opacity: 1;
      pointer-events: auto;
      animation: softPulse 1.6s infinite;
    }
    @keyframes softPulse {
      0%, 100% { opacity: 0.65; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.04); }
    }

    /* PHONG BÌ ĐÔI CÁNH THIÊN THẦN */
    .winged-letter-btn {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transform: scale(0.3);
      pointer-events: none;
      transition: all 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .winged-letter-btn.show {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }
    .angel-wing-svg {
      width: 44px;
      height: 44px;
      fill: #fff;
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.8));
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .angel-wing-svg.left {
      transform-origin: right center;
      animation: wingLeft 0.7s infinite alternate ease-in-out;
    }
    .angel-wing-svg.right {
      transform-origin: left center;
      animation: wingRight 0.7s infinite alternate ease-in-out;
    }
    @keyframes wingLeft { from { transform: rotate(-14deg); } to { transform: rotate(12deg); } }
    @keyframes wingRight { from { transform: scaleX(-1) rotate(-14deg); } to { transform: scaleX(-1) rotate(12deg); } }

    .envelope-box-svg {
      width: 62px;
      height: 46px;
      background: #f5e1c8;
      border-radius: 5px;
      position: relative;
      box-shadow: 0 0 18px rgba(255, 180, 200, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #e0c3a0;
    }
    .envelope-box-svg::before {
      content: "";
      position: absolute;
      top: 0;
      width: 0;
      height: 0;
      border-left: 29px solid transparent;
      border-right: 29px solid transparent;
      border-top: 22px solid #ebd0b0;
    }
    .seal-heart {
      position: relative;
      z-index: 2;
      color: #d81b60;
      font-size: 1.1rem;
      margin-top: 4px;
    }

    /* KHUNG THƯ HỒNG TỰ GIÃN CHIỀU CAO + CUỘN MƯỢT CHO BỨC THƯ DÀI */
    .expanding-letter-card {
      position: absolute;
      width: 88%;
      max-width: 440px;
      max-height: 82dvh;
      overflow-y: auto;
      scrollbar-width: none;
      background: linear-gradient(180deg, #ffd6e4 0%, #ffc1d5 100%);
      border-radius: 16px;
      padding: 22px 20px 26px;
      color: #3d1022;
      text-align: center;
      box-shadow: 0 0 75px 18px rgba(255, 160, 195, 0.55), inset 0 0 12px rgba(255, 255, 255, 0.8);
      opacity: 0;
      transform: scaleX(0.3) scaleY(0.2);
      pointer-events: none;
      transition: opacity 0.45s ease, transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .expanding-letter-card::-webkit-scrollbar {
      display: none;
    }
    .expanding-letter-card.show {
      opacity: 1;
      transform: scaleX(1) scaleY(1);
      pointer-events: auto;
    }

    .corner-butterfly {
      position: sticky;
      width: 28px;
      height: 28px;
      pointer-events: none;
      filter: drop-shadow(0 2px 6px rgba(216, 27, 96, 0.4));
    }
    .corner-butterfly.tl {
      top: 0;
      float: left;
      margin-left: -10px;
      margin-top: -10px;
      transform: rotate(-28deg);
    }
    .corner-butterfly.br {
      bottom: 0;
      float: right;
      margin-right: -10px;
      margin-bottom: -10px;
      transform: rotate(25deg);
    }

    .letter-heading {
      font-family: 'Cormorant Garamond', 'Dancing Script', serif;
      font-style: italic;
      font-weight: 700;
      font-size: 1.35rem;
      color: #880e4f;
      margin-bottom: 10px;
      clear: both;
    }
    .letter-content {
      font-family: 'Cormorant Garamond', 'Dancing Script', serif;
      font-style: italic;
      font-weight: 600;
      font-size: 1.14rem;
      line-height: 1.52;
      color: #3b1222;
      white-space: pre-line;
      text-align: left;
      padding: 0 4px;
    }
    .type-cursor {
      display: inline-block;
      width: 1.5px;
      height: 1rem;
      background: #880e4f;
      margin-left: 2px;
      animation: blink 0.6s infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* Khung ảnh kỷ niệm mở ra bên dưới chữ */
    .letter-photo-frame {
      width: 215px;
      height: 0;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 12px;
      border: 0px solid #fff;
      transition: height 0.9s cubic-bezier(0.22, 1, 0.36, 1), margin-top 0.5s ease, border-width 0.3s ease;
    }
    .letter-photo-frame.expand {
      height: 235px;
      margin-top: 16px;
      border-width: 3px;
      box-shadow: 0 8px 22px rgba(136, 14, 79, 0.25);
    }
    .letter-photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .bottom-tiny-heart {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #d81b60;
    }
  </style>
</head>
<body>

  <!-- 1. MÀN HÌNH QUÉT QR TRÁI TIM ĐỎ -->
  <div id="qr-intro-screen">
    <div class="scanner-viewfinder" id="qr-scanner-trigger">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

      <div class="red-heart-qr-wrap">
        <svg class="red-heart-svg" viewBox="0 0 260 250">
          <defs>
            <radialGradient id="redHeartInnerGlow" cx="50%" cy="40%" r="65%">
              <stop offset="0%" stop-color="rgba(255, 40, 70, 0.18)"/>
              <stop offset="70%" stop-color="rgba(220, 10, 40, 0.08)"/>
              <stop offset="100%" stop-color="rgba(150, 0, 25, 0.02)"/>
            </radialGradient>
            <filter id="redNeonFilter" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="3.5" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <!-- Ngoài viền là hình trái tim đỏ rực rỡ, bên trong chứa mã QR màu đỏ -->
          <path fill="url(#redHeartInnerGlow)" 
                stroke="#ff2046" stroke-width="3" stroke-linejoin="round"
                filter="url(#redNeonFilter)"
                d="M130,230 
                   L40,140 
                   C12,112 12,62 45,32 
                   C80,2 120,20 130,52 
                   C140,20 180,2 215,32 
                   C248,62 248,112 220,140 
                   Z" />
        </svg>
        <div id="heart-qr-box"></div>
      </div>
    </div>
    <div class="qr-hint">Chạm vào Trái Tim QR (hoặc quét bằng Camera) để mở</div>
  </div>

  <!-- 2. MÀN HÌNH "Đang tải..." -->
  <div id="loading-screen">Đang tải...</div>

  <!-- Hào quang hồng phía sau Quả Cầu Trái Tim -->
  <div id="sphere-core-glow"></div>

  <!-- 3. CANVAS 3D CHÍNH -->
  <canvas id="webgl-canvas"></canvas>

  <!-- 4. LỚP GIAO DIỆN TƯƠNG TÁC -->
  <div class="ui-layer">
    <!-- Nút "Giữ để bắt đầu" -->
    <div class="hold-container" id="hold-btn">
      <div class="hold-label">Giữ để bắt đầu</div>
      <div class="ring-wrapper">
        <svg class="progress-ring">
          <circle class="progress-ring__bg" r="23" cx="27" cy="27"></circle>
          <circle class="progress-ring__circle" id="hold-progress" r="23" cx="27" cy="27"></circle>
        </svg>
      </div>
    </div>

    <!-- Ảnh Bánh Kem Thật -->
    <div class="cake-photo-box" id="cake-photo-box">
      <img id="cake-img" src="" alt="Birthday Cake" />
    </div>

    <!-- Chữ "Click vào nhé" -->
    <div class="click-hint-bottom" id="click-grid-hint">Click vào nhé</div>

    <!-- Nút "Tiếp tục" chuyển từng cảnh tương tác -->
    <button class="next-step-btn" id="next-step-btn">
      <span id="next-step-label">Tiếp tục</span>
      <span style="font-size: 1.15rem;">✨</span>
    </button>

    <!-- Phong bì Cánh Thiên Thần -->
    <div class="winged-letter-btn" id="winged-envelope">
      <svg class="angel-wing-svg left" id="wing-l" viewBox="0 0 64 64">
        <path d="M58,48 C42,50 24,44 12,30 C22,32 34,30 44,24 C28,24 14,16 6,4 C20,10 38,12 52,20 C56,28 58,38 58,48 Z"/>
      </svg>
      <div class="envelope-box-svg">
        <span class="seal-heart">❤️</span>
      </div>
      <svg class="angel-wing-svg right" id="wing-r" viewBox="0 0 64 64">
        <path d="M58,48 C42,50 24,44 12,30 C22,32 34,30 44,24 C28,24 14,16 6,4 C20,10 38,12 52,20 C56,28 58,38 58,48 Z"/>
      </svg>
    </div>

    <!-- Bức Thư Hồng Tự Giãn Chiều Cao (Lựa chọn 2) -->
    <div class="expanding-letter-card" id="letter-card">
      <svg class="corner-butterfly tl" viewBox="0 0 64 64">
        <path fill="#ff4081" d="M30,32 C14,10 2,16 6,34 C10,48 24,44 30,36 C36,44 50,48 54,34 C58,16 46,10 30,32 Z"/>
      </svg>

      <div class="letter-heading" id="letter-heading"></div>
      <div class="letter-content">
        <span id="typed-content"></span><span class="type-cursor" id="type-cursor"></span>
      </div>

      <div class="letter-photo-frame" id="letter-photo-frame">
        <img id="couple-img" src="" alt="Special Girl Photo" />
      </div>
      <div class="bottom-tiny-heart">❤️</div>

      <svg class="corner-butterfly br" viewBox="0 0 64 64">
        <path fill="#ff80ab" d="M30,32 C14,10 2,16 6,34 C10,48 24,44 30,36 C36,44 50,48 54,34 C58,16 46,10 30,32 Z"/>
      </svg>
    </div>
  </div>

  <script>
    /* =========================================================================
       CẤU HÌNH NỘI DUNG LỰA CHỌN 2: LÃNG MẠN, TINH TẾ & RUNG ĐỘNG
       ========================================================================= */
    const CONFIG = {
      text1: "Chúc\nMừng\nSinh Nhật",
      text2: "Cô Gái\nDịu Dàng ❤️", // Bạn có thể đổi thành tên thật của bạn nữ (VD: "Minh Anh ❤️")
      cakePhoto: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=700&q=85",
      letterTitle: "Gửi cô gái mang theo cả bầu trời dịu dàng,",
      letterText: "\"Hôm nay là ngày thế giới đón chào một người cực kỳ đáng quý, nên mình muốn dành tặng bạn một không gian chỉ thuộc về riêng bạn — nơi không có deadline, không có muộn phiền, chỉ có những vì sao và sự trân trọng mình dành cho bạn.\n\nGiữa hàng vạn người lướt qua nhau mỗi ngày, thật may mắn vì mình đã được gặp bạn, được nhìn thấy dáng vẻ rạng rỡ khi bạn cười và cả sự ấm áp trong từng hành động nhỏ của bạn. Có lẽ bạn không nhận ra đâu, nhưng chính bạn đã làm những ngày bình thường nhất trở nên có ý nghĩa hơn rất nhiều.\n\nTuổi mới, chúc bạn mỗi sáng thức dậy đều có lý do để mỉm cười, mỗi tối đi ngủ đều thấy lòng an nhiên. Người ta nói những điều đẹp đẽ nhất đều cần thời gian và sự chân thành để mở khóa — giống như cách bạn vừa kiên nhẫn đi qua từng bước nhỏ để mở bức thư này vậy.\n\nMình đã gom hết sự kiên nhẫn và chân thành đặt vào đây rồi, nếu trái tim bạn cũng có một chút rung động, thì đừng giữ trong lòng một mình nhé, hãy cho mình cơ hội được chăm sóc bạn nhiều hơn một người bạn bình thường nha!\"",
      couplePhoto: "./hoa-hong.jpg" // Ảnh bó hoa hồng trái tim đã tải lên
    };

    document.getElementById("cake-img").src = CONFIG.cakePhoto;
    document.getElementById("couple-img").src = CONFIG.couplePhoto;

    // Tạo mã QR màu đỏ đồng bộ nằm khớp góc vuông với đáy nhọn trái tim
    if (window.QRCodeStyling) {
      const liveUrl = (window.location.protocol === "file:")
        ? "https://ntandien.github.io/sn..vn-/"
        : window.location.href;

      const qr = new QRCodeStyling({
        width: 135,
        height: 135,
        data: liveUrl,
        margin: 2,
        dotsOptions: { color: "#ff2042", type: "rounded" },
        cornersSquareOptions: { color: "#ff2042", type: "extra-rounded" },
        cornersDotOptions: { color: "#ff2042", type: "dot" },
        backgroundOptions: { color: "transparent" }
      });
      qr.append(document.getElementById("heart-qr-box"));
    }

    /* =========================================================================
       KHỞI TẠO KHÔNG GIAN 3D & 20.000 HẠT TRÒN MỊN (SOFT GLOW PARTICLES)
       ========================================================================= */
    const canvas = document.getElementById("webgl-canvas");
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 2500);
    camera.position.z = 330;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enabled = false;

    function createSoftDotTexture() {
      const c = document.createElement("canvas");
      c.width = 64;
      c.height = 64;
      const ctx = c.getContext("2d");
      const grad = ctx.createRadialGradient(32, 32, 2, 32, 32, 30);
      grad.addColorStop(0, "rgba(255, 255, 255, 1)");
      grad.addColorStop(0.4, "rgba(255, 220, 240, 0.85)");
      grad.addColorStop(1, "rgba(255, 100, 180, 0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(32, 32, 30, 0, Math.PI * 2);
      ctx.fill();
      return new THREE.CanvasTexture(c);
    }
    const dotTexture = createSoftDotTexture();

    // Bầu trời sao trắng nền sâu
    const STAR_COUNT = 2200;
    const starGeo = new THREE.BufferGeometry();
    const starPositions = new Float32Array(STAR_COUNT * 3);
    for (let i = 0; i < STAR_COUNT * 3; i++) {
      starPositions[i] = (Math.random() - 0.5) * 1600;
    }
    starGeo.setAttribute("position", new THREE.BufferAttribute(starPositions, 3));
    const starMat = new THREE.PointsMaterial({
      size: 3.5,
      map: dotTexture,
      color: 0xffffff,
      transparent: true,
      opacity: 0.75,
      depthWrite: false
    });
    const starField = new THREE.Points(starGeo, starMat);
    scene.add(starField);

    /* =========================================================================
       HỆ THỐNG 20.000 HẠT KIM TUYẾN BIẾN HÌNH (BỤI HỒNG VŨ TRỤ)
       ========================================================================= */
    const P_COUNT = 20000;
    const pGeo = new THREE.BufferGeometry();
    const curPos = new Float32Array(P_COUNT * 3);
    const tarPos = new Float32Array(P_COUNT * 3);
    const pColors = new Float32Array(P_COUNT * 3);

    const cDeepPink = new THREE.Color("#e91e63");
    const cBrightPink = new THREE.Color("#ff80ab");
    const cGold = new THREE.Color("#ffe082");

    // Ban đầu phân tán toàn bộ hạt bụi hồng ra ngoài xa vô cực của vũ trụ (không hiện vòng tròn ở giữa)
    for (let i = 0; i < P_COUNT; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos((Math.random() * 2) - 1);
      const dist = 600 + Math.random() * 950;

      curPos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
      curPos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
      curPos[i * 3 + 2] = dist * Math.cos(phi);

      tarPos[i * 3] = curPos[i * 3];
      tarPos[i * 3 + 1] = curPos[i * 3 + 1];
      tarPos[i * 3 + 2] = curPos[i * 3 + 2];

      const col = cDeepPink.clone().lerp(cBrightPink, Math.random());
      pColors[i * 3] = col.r;
      pColors[i * 3 + 1] = col.g;
      pColors[i * 3 + 2] = col.b;
    }

    pGeo.setAttribute("position", new THREE.BufferAttribute(curPos, 3));
    pGeo.setAttribute("color", new THREE.BufferAttribute(pColors, 3));

    const pMat = new THREE.PointsMaterial({
      size: 3.6,
      map: dotTexture,
      vertexColors: true,
      transparent: true,
      opacity: 0.0, // Ban đầu tàng hình: chỉ có không gian vũ trụ tĩnh lặng bao la!
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const mainParticles = new THREE.Points(pGeo, pMat);
    scene.add(mainParticles);

    function sampleDenseText(text, fontSize = 95) {
      const c = document.createElement("canvas");
      c.width = 900;
      c.height = 550;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, c.width, c.height);

      ctx.fillStyle = "#fff";
      ctx.font = `800 ${fontSize}px 'Montserrat', sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const lines = text.split("\n");
      const lh = fontSize * 1.18;
      const startY = c.height / 2 - ((lines.length - 1) * lh) / 2;
      lines.forEach((line, idx) => ctx.fillText(line, c.width / 2, startY + idx * lh));

      const data = ctx.getImageData(0, 0, c.width, c.height).data;
      const pts = [];
      for (let y = 0; y < c.height; y += 2) {
        for (let x = 0; x < c.width; x += 2) {
          if (data[(y * c.width + x) * 4] > 128) {
            pts.push({
              x: (x - c.width / 2) * 0.42,
              y: (c.height / 2 - y) * 0.42,
              z: (Math.random() - 0.5) * 6
            });
          }
        }
      }
      return pts;
    }

    function generateCakeHologramPoints() {
      const pts = [];
      for (let y = -65; y <= 35; y += 3) {
        const radius = 85;
        const countInRing = 180;
        for (let j = 0; j < countInRing; j++) {
          const a = (j / countInRing) * Math.PI * 2;
          pts.push({
            x: Math.cos(a) * radius,
            y: y + Math.sin(a) * 28,
            z: Math.sin(a) * radius
          });
        }
      }
      const candleX = [-55, -28, 0, 28, 55];
      candleX.forEach((cx) => {
        for (let cy = 35; cy <= 85; cy += 1.5) {
          pts.push({ x: cx + (Math.random() - 0.5) * 4, y: cy, z: (Math.random() - 0.5) * 4 });
        }
      });
      return pts;
    }

    function setParticleTargets(pts, baseColorHex, spreadJitter = 1.4) {
      const baseCol = new THREE.Color(baseColorHex);
      const colArr = pGeo.attributes.color.array;
      for (let i = 0; i < P_COUNT; i++) {
        const pt = pts[i % pts.length];
        tarPos[i * 3] = pt.x + (Math.random() - 0.5) * spreadJitter;
        tarPos[i * 3 + 1] = pt.y + (Math.random() - 0.5) * spreadJitter;
        tarPos[i * 3 + 2] = pt.z + (Math.random() - 0.5) * spreadJitter;

        const c = baseCol.clone().offsetHSL(0, 0, (Math.random() - 0.5) * 0.22);
        colArr[i * 3] = c.r;
        colArr[i * 3 + 1] = c.g;
        colArr[i * 3 + 2] = c.b;
      }
      pGeo.attributes.color.needsUpdate = true;
    }

    /* =========================================================================
       2 LOẠI STICKER TRÁI TIM Y2K CHUẨN NHƯ VIDEO
       ========================================================================= */
    function createY2KBubbleHeartTexture() {
      const c = document.createElement("canvas");
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext("2d");

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(128, 222);
      ctx.bezierCurveTo(118, 210, 24, 152, 24, 86);
      ctx.bezierCurveTo(24, 42, 66, 22, 100, 22);
      ctx.bezierCurveTo(116, 22, 128, 35, 128, 48);
      ctx.bezierCurveTo(128, 35, 140, 22, 156, 22);
      ctx.bezierCurveTo(190, 22, 232, 42, 232, 86);
      ctx.bezierCurveTo(232, 152, 138, 210, 128, 222);
      ctx.closePath();

      ctx.lineWidth = 10;
      ctx.strokeStyle = "#3a0018";
      ctx.stroke();

      const grad = ctx.createRadialGradient(96, 76, 10, 128, 125, 110);
      grad.addColorStop(0, "#ffeef5");
      grad.addColorStop(0.28, "#ff85b3");
      grad.addColorStop(0.72, "#eb1468");
      grad.addColorStop(1, "#7a0032");
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(76, 72, 24, 11, -0.55, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255, 255, 255, 0.88)";
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(168, 66, 12, 6, 0.4, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
      ctx.fill();
      ctx.restore();
      return new THREE.CanvasTexture(c);
    }

    function createNeonOutlineHeartTexture() {
      const c = document.createElement("canvas");
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext("2d");

      function strokeHeart(cx, cy, sc) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(sc, sc);
        ctx.beginPath();
        ctx.moveTo(0, 70);
        ctx.bezierCurveTo(-10, 60, -80, 15, -80, -35);
        ctx.bezierCurveTo(-80, -70, -45, -85, -20, -85);
        ctx.bezierCurveTo(-5, -85, 0, -72, 0, -60);
        ctx.bezierCurveTo(0, -72, 5, -85, 20, -85);
        ctx.bezierCurveTo(45, -85, 80, -70, 80, -35);
        ctx.bezierCurveTo(80, 15, 10, 60, 0, 70);
        ctx.closePath();
        ctx.shadowColor = "#ff1e78";
        ctx.shadowBlur = 16;
        ctx.lineWidth = 10;
        ctx.strokeStyle = "#ff80ab";
        ctx.stroke();
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#ffffff";
        ctx.stroke();
        ctx.restore();
      }
      strokeHeart(105, 130, 0.85);
      strokeHeart(155, 105, 0.55);
      return new THREE.CanvasTexture(c);
    }

    const texBubble = createY2KBubbleHeartTexture();
    const texNeon = createNeonOutlineHeartTexture();

    const heartGroup = new THREE.Group();
    scene.add(heartGroup);
    const heartSprites = [];
    const TOTAL_HEARTS = 135;

    for (let i = 0; i < TOTAL_HEARTS; i++) {
      const isBubble = i % 3 !== 0;
      const mat = new THREE.SpriteMaterial({
        map: isBubble ? texBubble : texNeon,
        transparent: true,
        opacity: 0
      });
      const sp = new THREE.Sprite(mat);

      const phi = Math.acos(1 - (2 * (i + 0.5)) / TOTAL_HEARTS);
      const theta = Math.PI * (1 + Math.sqrt(5)) * i;
      const rSphere = 135;
      const spherePos = new THREE.Vector3(
        rSphere * Math.sin(phi) * Math.cos(theta),
        rSphere * Math.sin(phi) * Math.sin(theta),
        rSphere * Math.cos(phi)
      );

      const cols = 6;
      const row = Math.floor(i / cols);
      const col = i % cols;
      const gridPos = new THREE.Vector3(
        (col - 2.5) * 44 + (row % 2 === 0 ? 14 : -14),
        (6 - row) * 40,
        (Math.random() - 0.5) * 25
      );

      const freePos = new THREE.Vector3(
        (Math.random() - 0.5) * 560,
        (Math.random() - 0.5) * 560,
        (Math.random() - 0.5) * 460
      );

      sp.userData = {
        spherePos,
        gridPos,
        freePos,
        baseScale: isBubble ? (22 + Math.random() * 24) : (16 + Math.random() * 14)
      };
      sp.position.copy(freePos);
      sp.scale.set(sp.userData.baseScale, sp.userData.baseScale, 1);

      heartGroup.add(sp);
      heartSprites.push(sp);
    }

    /* =========================================================================
       ĐIỀU KHIỂN KỊCH BẢN TỪNG GIÂY
       ========================================================================= */
    let stage = "QR_INTRO";
    let lerpSpeed = 0.075;

    document.getElementById("qr-scanner-trigger").addEventListener("click", () => {
      const qrScreen = document.getElementById("qr-intro-screen");
      const loadScreen = document.getElementById("loading-screen");
      qrScreen.style.opacity = "0";
      setTimeout(() => {
        qrScreen.style.display = "none";
        loadScreen.style.display = "flex";
        setTimeout(() => {
          loadScreen.style.display = "none";
          stage = "NEBULA_WAIT";
          document.getElementById("hold-btn").classList.add("visible");
        }, 1200);
      }, 550);
    });

    const holdBtn = document.getElementById("hold-btn");
    const holdCircle = document.getElementById("hold-progress");
    let holdTimer = null;
    let holdPercent = 0;

    // Hiệu ứng âm thanh tương tác ngọt ngào (Web Audio API)
    let audioCtx = null;
    function playSfx(type = "click") {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const t = audioCtx.currentTime;

        if (type === "click") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(587.33, t);
          osc.frequency.exponentialRampToValueAtTime(880, t + 0.12);
          gain.gain.setValueAtTime(0.12, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
          osc.start(t);
          osc.stop(t + 0.12);
        } else if (type === "hold") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(329.63, t);
          osc.frequency.exponentialRampToValueAtTime(659.25, t + 0.25);
          gain.gain.setValueAtTime(0.07, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
          osc.start(t);
          osc.stop(t + 0.25);
        } else if (type === "magic") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(523.25, t);
          osc.frequency.exponentialRampToValueAtTime(1046.5, t + 0.45);
          gain.gain.setValueAtTime(0.12, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
          osc.start(t);
          osc.stop(t + 0.45);
        }
      } catch (err) {}
    }

    function startHolding(e) {
      if (e) e.preventDefault();
      if (stage !== "NEBULA_WAIT") return;

      playSfx("hold");

      clearInterval(holdTimer);
      holdTimer = setInterval(() => {
        holdPercent += 2.5;
        const offset = 144 - (144 * holdPercent) / 100;
        holdCircle.style.strokeDashoffset = offset;

        // Khi nhấn giữ: các hạt bụi màu hồng bắt đầu xuất hiện và sáng dần từ vũ trụ
        pMat.opacity = Math.min(1.0, (holdPercent / 100) * 1.15);

        // Hạt bụi hồng từ các phía sâu thẳm vũ trụ bắt đầu ùa về tâm
        const factor = 1 - (holdPercent / 100) * 0.75;
        for (let i = 0; i < P_COUNT; i++) {
          tarPos[i * 3] = curPos[i * 3] * factor;
          tarPos[i * 3 + 1] = curPos[i * 3 + 1] * factor;
          tarPos[i * 3 + 2] = curPos[i * 3 + 2] * factor;
        }

        if (holdPercent >= 100) {
          clearInterval(holdTimer);
          pMat.opacity = 1.0;
          playSfx("magic");
          runParticleStoryline();
        }
      }, 30);
    }

    function stopHolding() {
      if (stage !== "NEBULA_WAIT" || holdPercent >= 100) return;
      clearInterval(holdTimer);
      holdPercent = 0;
      holdCircle.style.strokeDashoffset = 144;
      // Nhả tay ra thì hạt bụi hồng phân tán lại về vũ trụ xa và mờ dần
      gsap.to(pMat, { opacity: 0, duration: 0.6 });
      for (let i = 0; i < P_COUNT; i++) {
        tarPos[i * 3] = curPos[i * 3];
        tarPos[i * 3 + 1] = curPos[i * 3 + 1];
        tarPos[i * 3 + 2] = curPos[i * 3 + 2];
      }
    }

    holdBtn.addEventListener("mousedown", startHolding);
    holdBtn.addEventListener("touchstart", startHolding, { passive: false });
    window.addEventListener("mouseup", stopHolding);
    window.addEventListener("touchend", stopHolding);

    const nextBtn = document.getElementById("next-step-btn");
    const nextLabel = document.getElementById("next-step-label");
    let nextCallback = null;

    function showNextStepBtn(text, callback) {
      nextLabel.textContent = text;
      nextCallback = callback;
      nextBtn.classList.add("show");
    }

    function hideNextStepBtn() {
      nextBtn.classList.remove("show");
      nextCallback = null;
    }

    nextBtn.addEventListener("click", () => {
      if (nextCallback) {
        playSfx("click");
        const cb = nextCallback;
        hideNextStepBtn();
        cb();
      }
    });

    // BƯỚC 1: Hiện Chữ "Chúc Mừng Sinh Nhật" sau khi nhấn giữ
    function runParticleStoryline() {
      stage = "MORPH_TEXT";
      pMat.opacity = 1.0;
      lerpSpeed = 0.085;
      holdBtn.classList.remove("visible");
      setTimeout(() => holdBtn.style.display = "none", 500);

      // Chữ "Chúc Mừng Sinh Nhật" - ghép từ các hạt bụi hồng bay từ vũ trụ vào
      const pts1 = sampleDenseText(CONFIG.text1, 90);
      setParticleTargets(pts1, "#ff2a85", 1.5);

      // Chuyển sang ánh vàng kim lấp lánh
      setTimeout(() => {
        const colArr = pGeo.attributes.color.array;
        for (let i = 0; i < P_COUNT; i++) {
          const c = cGold.clone().offsetHSL(0, 0, (Math.random() - 0.5) * 0.25);
          colArr[i * 3] = c.r;
          colArr[i * 3 + 1] = c.g;
          colArr[i * 3 + 2] = c.b;
        }
        pGeo.attributes.color.needsUpdate = true;
      }, 1200);

      // Hiện nút "Tiếp tục ✨" để người xem bấm mới chuyển
      setTimeout(() => {
        showNextStepBtn("Tiếp tục", step2_NameText);
      }, 1800);
    }

    // BƯỚC 2: Chuyển sang chữ tên người ấy ("Cô Gái Dịu Dàng ❤️")
    function step2_NameText() {
      // Gió thổi nhẹ xé chữ cũ
      for (let i = 0; i < P_COUNT; i++) {
        tarPos[i * 3] += (Math.random() - 0.35) * 260;
      }

      // Tụ lại thành chữ mới
      setTimeout(() => {
        const pts2 = sampleDenseText(CONFIG.text2, 86);
        setParticleTargets(pts2, "#ff5c9e", 1.4);
      }, 600);

      // Hiện nút "Tiếp tục ✨"
      setTimeout(() => {
        showNextStepBtn("Tiếp tục", step3_Cake);
      }, 2000);
    }

    // BƯỚC 3: Hiện Bánh Kem Sinh Nhật Hologram & Ảnh Bánh Kem
    function step3_Cake() {
      // Hạt vàng ghép thành Hologram 3D Chiếc Bánh Kem
      const cakePts = generateCakeHologramPoints();
      setParticleTargets(cakePts, "#ffe082", 2.0);

      // Hiện bức ảnh Bánh Kem Thật
      setTimeout(() => {
        document.getElementById("cake-photo-box").classList.add("show");
        gsap.to(pMat, { opacity: 0.2, duration: 1.0 });
      }, 900);

      // Hiện nút "Tiếp tục ✨" để người xem ngắm xong bánh kem
      setTimeout(() => {
        showNextStepBtn("Tiếp tục", step4_HeartSphere);
      }, 2200);
    }

    // BƯỚC 4: Quả Cầu Trái Tim 3D
    function step4_HeartSphere() {
      // Ẩn ảnh bánh kem, làm mờ hạt hologram
      document.getElementById("cake-photo-box").classList.remove("show");
      gsap.to(pMat, { opacity: 0, duration: 0.8 });

      stage = "HEART_SPHERE";
      controls.enabled = true;
      document.getElementById("sphere-core-glow").style.opacity = "1";

      heartSprites.forEach((sp, idx) => {
        gsap.to(sp.material, { opacity: 1, duration: 0.9, delay: idx * 0.005 });
        gsap.to(sp.position, {
          x: sp.userData.spherePos.x,
          y: sp.userData.spherePos.y,
          z: sp.userData.spherePos.z,
          duration: 1.8,
          ease: "power3.out"
        });
      });

      // Sau khi quả cầu trái tim hình thành, hiện nút "Tiếp tục ✨"
      setTimeout(() => {
        showNextStepBtn("Tiếp tục", step5_HeartGrid);
      }, 2400);
    }

    // BƯỚC 5: Xếp thành Lưới Trái Tim Phẳng
    function step5_HeartGrid() {
      stage = "HEART_GRID";
      gsap.to(heartGroup.rotation, { x: 0, y: 0, z: 0, duration: 1.2 });
      heartSprites.slice(0, 42).forEach((sp) => {
        gsap.to(sp.position, {
          x: sp.userData.gridPos.x,
          y: sp.userData.gridPos.y,
          z: sp.userData.gridPos.z,
          duration: 1.3,
          ease: "power2.inOut"
        });
      });

      setTimeout(() => {
        showNextStepBtn("Mở Mật Thư ✨", scatterHeartsToSpace);
      }, 1400);
    }

    // BƯỚC 6: Trái tim bay tự do & Hiện Phong bì thiên thần
    function scatterHeartsToSpace() {
      if (stage !== "HEART_GRID" && stage !== "HEART_SPHERE") return;
      stage = "HEART_FREE";
      hideNextStepBtn();
      document.getElementById("click-grid-hint").classList.remove("show");
      document.getElementById("sphere-core-glow").style.opacity = "0";

      heartSprites.forEach((sp) => {
        gsap.to(sp.position, {
          x: sp.userData.freePos.x,
          y: sp.userData.freePos.y,
          z: sp.userData.freePos.z,
          duration: 2.0,
          ease: "power2.out"
        });
      });

      setTimeout(() => {
        document.getElementById("winged-envelope").classList.add("show");
      }, 3200);
    }

    document.getElementById("click-grid-hint").addEventListener("click", scatterHeartsToSpace);
    window.addEventListener("click", () => {
      if (stage === "HEART_GRID") scatterHeartsToSpace();
    });

    // 11. Chạm vào Phong Bì -> Mở Thư Hồng Tự Cuộn + Gõ chữ + Hiện Ảnh
    document.getElementById("winged-envelope").addEventListener("click", () => {
      const env = document.getElementById("winged-envelope");
      document.getElementById("wing-l").style.opacity = "0";
      document.getElementById("wing-r").style.opacity = "0";

      setTimeout(() => {
        env.classList.remove("show");
        heartSprites.forEach(sp => gsap.to(sp.material, { opacity: 0.15, duration: 0.8 }));

        const card = document.getElementById("letter-card");
        card.classList.add("show");

        const headingEl = document.getElementById("letter-heading");
        const contentEl = document.getElementById("typed-content");
        headingEl.textContent = CONFIG.letterTitle;

        let idx = 0;
        const fullMsg = CONFIG.letterText;
        const typer = setInterval(() => {
          contentEl.textContent += fullMsg.charAt(idx);
          // Tự động cuộn mượt xuống theo từng dòng chữ đang được gõ
          card.scrollTop = card.scrollHeight;
          idx++;
          if (idx >= fullMsg.length) {
            clearInterval(typer);
            document.getElementById("type-cursor").style.display = "none";
            const photoFrame = document.getElementById("letter-photo-frame");
            photoFrame.classList.add("expand");
            setTimeout(() => {
              card.scrollTo({ top: card.scrollHeight, behavior: "smooth" });
            }, 350);
          }
        }, 48);
      }, 450);
    });

    /* =========================================================================
       VÒNG LẶP RENDER 60FPS
       ========================================================================= */
    function animate() {
      requestAnimationFrame(animate);

      starField.rotation.y += 0.0005;

      if (stage === "NEBULA_WAIT" || stage === "MORPH_TEXT") {
        if (stage === "NEBULA_WAIT") {
          mainParticles.rotation.z += 0.003;
        } else {
          mainParticles.rotation.z *= 0.9;
        }
        const pos = pGeo.attributes.position.array;
        for (let i = 0; i < P_COUNT * 3; i++) {
          pos[i] += (tarPos[i] - pos[i]) * lerpSpeed;
        }
        pGeo.attributes.position.needsUpdate = true;
      }

      if (stage === "HEART_SPHERE") {
        heartGroup.rotation.y += 0.007;
        controls.update();
      } else if (stage === "HEART_FREE") {
        heartGroup.rotation.y += 0.002;
        controls.update();
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
